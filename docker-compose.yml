# version: "3.9"
services:
  web:
    image: gumon.dev/ss-house/frontend-kyra:0.2.15
    container_name: frontend-kyra
    ports:
      - "3400:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:''+ (process.env.PORT||3000), r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
